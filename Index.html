<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Natural View Wallpapers</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef7f0;
            color: #1f3d2b;
        }

        header {
            background: #164a2b;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 15px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .wallpapers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 15px;
            text-align: center;
        }

        .card-content h2 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .download {
            display: inline-block;
            background: #198754;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .download:hover {
            background: #116b42;
        }

        footer {
            margin-top: 40px;
            background: #164a2b;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌿 Natural View</h1>
        <p>Beautiful Nature Wallpapers for Your Phone</p>
    </header>

    <div class="container">

        <div class="wallpapers">

            <!-- Wallpaper 1 -->
            <div class="card">
                <img 
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                    alt="Mountain Nature">
                
                <div class="card-content">
                    <h2>Mountain View</h2>

                    <a 
                        class="download"
                        href="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                        download>
                        Download Wallpaper
                    </a>
                </div>
            </div>


            <!-- Wallpaper 2 -->
            <div class="card">
                <img 
                    src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
                    alt="Beautiful Landscape">

                <div class="card-content">
                    <h2>Beautiful Landscape</h2>

                    <a 
                        class="download"
                        href="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
                        download>
                        Download Wallpaper
                    </a>
                </div>
            </div>


            <!-- Wallpaper 3 -->
            <div class="card">
                <img 
                    src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                    alt="Forest">

                <div class="card-content">
                    <h2>Green Forest</h2>

                    <a 
                        class="download"
                        href="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                        download>
                        Download Wallpaper
                    </a>
                </div>
            </div>


            <!-- Wallpaper 4 -->
            <div class="card">
                <img 
                    src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                    alt="Mountain">

                <div class="card-content">
                    <h2>Snow Mountains</h2>

                    <a 
                        class="download"
                        href="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                        download>
                        Download Wallpaper
                    </a>
                </div>
            </div>

        </div>

    </div>

    <footer>
        <p>© 2026 Natural View | Nature Wallpapers</p>
    </footer>

</body>
</html>
